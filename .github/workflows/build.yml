name: Build and Release JAR

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Executable JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Java Sources (Java 8 Bytecode)
        run: |
          mkdir -p out
          javac --release 8 -d out src/*.java

      - name: Package Executable JAR
        run: |
          jar --create --file KMap.jar --manifest META-INF/MANIFEST.MF -C out src

      - name: Upload KMap.jar as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMap-Executable-JAR
          path: KMap.jar
          retention-days: 90

      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KMap.jar
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
